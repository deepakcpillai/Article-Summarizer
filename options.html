<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Article Summarizer Settings</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="settings-page">
    <main class="settings-shell">
      <h1>Article Summarizer Settings</h1>
      <p class="muted">Paste your OpenAI API key here. It will be stored in this browser profile and used only when you ask for a summary.</p>

      <label class="field">
        <span>OpenAI API key</span>
        <input id="apiKey" type="password" autocomplete="off" placeholder="sk-...">
      </label>

      <label class="field">
        <span>Model</span>
        <input id="model" type="text" autocomplete="off" placeholder="gpt-5.4-mini">
      </label>

      <div class="settings-actions">
        <button id="saveButton" class="primary-button">Save Settings</button>
        <button id="clearButton" class="secondary-button">Clear Key</button>
      </div>

      <section id="settingsStatus" class="status" role="status" aria-live="polite"></section>
    </main>

    <script src="options.js"></script>
  </body>
</html>
